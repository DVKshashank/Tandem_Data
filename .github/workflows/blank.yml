name: Post JSON File to Two URLs
on:
  push:
    branches:
      - main # Runs only when pushing to the main branch
  workflow_dispatch: # Allows manual trigger
jobs:
  post_json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Send JSON Data to First URL
        run: |
          curl -X POST "https://:OOyohDbwQuqJsM7oL9ieFA@eu.tandem.autodesk.com/api/v1/timeseries/models/urn:adsk.dtm:vx3H7ELYRACffZK7VC39wA/streams/AQAAAB6YB7F-uEf2u6UahKxXVvcAAAAA" \
              -H "Content-Type: application/json" \
              -d @stream.json
      - name: Send JSON Data to Second URL
        run: |
          curl -X POST "https://:Y4hqGQgTRwme_Jsyg0ml6g@eu.tandem.autodesk.com/api/v1/timeseries/models/urn:adsk.dtm:vx3H7ELYRACffZK7VC39wA/streams/AQAAAEYoJ3nUbUXrpxNC4Dv_23wAAAAA" \
              -H "Content-Type: application/json" \
              -d @stream.json
